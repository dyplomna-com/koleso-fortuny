<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо фортуни</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070707; --red:#d0021b; --red2:#8a0012; --ink:#f5f1ea; --muted:#9a8f8f; --gold:#e8c27a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(ellipse at 50% 35%, rgba(208,2,27,.28), transparent 60%),
      radial-gradient(ellipse at 50% 110%, rgba(138,0,18,.35), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:Inter,system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100vh; overflow-x:hidden;
  }
  header{ text-align:center; padding:22px 16px 6px }
  h1{
    font-family:Oswald,sans-serif; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    font-size:clamp(28px,5vw,52px); margin:0; line-height:1;
    background:linear-gradient(180deg,#fff 0%,#ffb3b3 45%,var(--red) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(208,2,27,.35);
  }
  .sub{color:var(--muted); font-size:14px; margin-top:8px; letter-spacing:.04em}

  main{ display:flex; gap:28px; align-items:center; justify-content:center; flex-wrap:wrap; padding:10px 16px 30px; width:100% }

  .wheel-wrap{ position:relative; width:min(78vh, 92vw, 640px); aspect-ratio:1 }
  .wheel-wrap::before{ /* glow */
    content:""; position:absolute; inset:-4%; border-radius:50%;
    background:radial-gradient(circle, rgba(208,2,27,.45) 55%, transparent 71%); filter:blur(18px); z-index:0;
  }
  canvas{ position:relative; z-index:1; width:100%; height:100%; display:block }
  .pointer{
    position:absolute; top:-2.5%; left:50%; transform:translateX(-50%); z-index:3; width:9%; transform-origin:50% 20%;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.7));
  }
  .pointer.tick{ animation:tick .12s ease-out }
  @keyframes tick{ 0%{transform:translateX(-50%) rotate(0)} 40%{transform:translateX(-50%) rotate(-14deg)} 100%{transform:translateX(-50%) rotate(0)} }

  .hub{
    position:absolute; z-index:2; left:50%; top:50%; width:20%; aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ff3b4f, var(--red) 45%, #4a000a 100%);
    box-shadow:0 0 0 5px #111, 0 0 0 8px var(--gold), 0 10px 30px rgba(0,0,0,.7), inset 0 -6px 14px rgba(0,0,0,.5);
    color:#fff; font-family:Oswald,sans-serif; font-weight:700; letter-spacing:.08em;
    font-size:clamp(14px,2.6vw,24px); text-transform:uppercase; transition:transform .15s;
  }
  .hub:hover{ transform:translate(-50%,-50%) scale(1.05) }
  .hub:disabled{ cursor:default; filter:saturate(.7) brightness(.85) }

  .panel{
    width:min(340px,92vw); background:linear-gradient(180deg,#151010,#0c0909); border:1px solid #2a1414;
    border-radius:18px; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .panel h2{ font-family:Oswald,sans-serif; font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:15px; color:var(--gold); margin:0 0 12px }
  label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px }
  .row{ display:flex; gap:8px; margin-bottom:16px }
  input[type=number]{
    flex:1; background:#000; border:1px solid #3a1a1a; color:var(--ink); border-radius:10px; padding:10px 12px;
    font-size:18px; font-family:Oswald,sans-serif; width:100%;
  }
  input[type=number]:focus{ outline:2px solid var(--red); border-color:transparent }
  button.btn{
    background:var(--red); color:#fff; border:none; border-radius:10px; padding:10px 14px; font-weight:600;
    font-family:Inter,sans-serif; cursor:pointer; font-size:14px; white-space:nowrap;
  }
  button.btn:hover{ background:#ef0a26 }
  button.ghost{ background:transparent; border:1px solid #3a1a1a; color:var(--ink) }
  button.ghost:hover{ background:#1d1010 }
  .toggle{ display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:14px; cursor:pointer; color:var(--ink) }
  .toggle input{ accent-color:var(--red); width:18px; height:18px }
  select{
    width:100%; background:#000; border:1px solid #3a1a1a; color:var(--ink); border-radius:10px; padding:9px 10px; font-size:14px; margin-bottom:16px;
  }
  .stats{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin:6px 0 8px }
  .stats b{ color:var(--ink); font-family:Oswald,sans-serif; font-size:16px }
  .history{ display:flex; flex-wrap:wrap; gap:6px; max-height:150px; overflow:auto; min-height:34px; padding:2px }
  .chip{
    font-family:Oswald,sans-serif; font-size:15px; min-width:34px; text-align:center; padding:4px 8px; border-radius:8px;
    background:#1d0b0d; border:1px solid #4a1418; color:#ffd7d7;
  }
  .chip.last{ background:var(--red); color:#fff; border-color:var(--red) }
  .empty{ color:#5c5050; font-size:13px }
  .actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap }
  .hint{ font-size:12px; color:#6d6060; margin-top:12px; line-height:1.5 }

  /* Reveal */
  .reveal{
    position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:radial-gradient(circle at center, rgba(120,0,14,.85), rgba(0,0,0,.94) 65%);
    backdrop-filter:blur(4px); cursor:pointer;
  }
  .reveal.show{ display:flex; animation:fadeIn .4s ease }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .reveal .label{
    font-family:Oswald,sans-serif; letter-spacing:.4em; text-transform:uppercase; color:var(--gold);
    font-size:clamp(16px,3vw,28px); opacity:0; animation:up .6s .2s ease forwards;
  }
  .card{ perspective:1200px; margin:18px 0 }
  .card-inner{
    width:clamp(220px,40vw,420px); aspect-ratio:3/4; position:relative; transform-style:preserve-3d;
    animation:flip 1.4s .5s cubic-bezier(.2,.9,.25,1.1) forwards; transform:rotateY(180deg) scale(.6);
  }
  @keyframes flip{ to{ transform:rotateY(0) scale(1) } }
  .face{
    position:absolute; inset:0; border-radius:24px; backface-visibility:hidden; display:flex; align-items:center; justify-content:center;
  }
  .front{
    background:linear-gradient(160deg,#1a0a0c,#000 70%); border:3px solid var(--red);
    box-shadow:0 0 60px rgba(208,2,27,.8), 0 0 140px rgba(208,2,27,.4), inset 0 0 40px rgba(208,2,27,.25);
  }
  .front::after{ content:""; position:absolute; inset:12px; border:1px solid rgba(232,194,122,.4); border-radius:16px }
  .num{
    font-family:Oswald,sans-serif; font-weight:700; line-height:1; font-size:clamp(110px,22vw,250px);
    background:linear-gradient(180deg,#fff 10%,#ff9a9a 55%,var(--red) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 25px rgba(255,40,60,.6));
  }
  .back{
    transform:rotateY(180deg); background:repeating-linear-gradient(45deg,var(--red) 0 14px,#000 14px 28px);
    border:3px solid var(--gold);
  }
  .back span{ font-family:Oswald,sans-serif; font-size:90px; color:var(--gold); background:#000; width:42%; aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid var(--gold) }
  .reveal .close{ color:var(--muted); font-size:14px; opacity:0; animation:up .6s 1.8s ease forwards }
  @keyframes up{ from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
  #confetti{ position:fixed; inset:0; z-index:21; pointer-events:none }

  .fs-btn{ position:fixed; top:14px; right:14px; z-index:5 }
  .langs{ position:fixed; top:14px; left:14px; z-index:5; display:flex; border:1px solid #3a1a1a; border-radius:10px; overflow:hidden; background:#0c0909 }
  .langs button{ background:transparent; color:var(--muted); border:none; padding:9px 12px; font:600 13px Inter,sans-serif; cursor:pointer; letter-spacing:.05em }
  .langs button:hover{ color:var(--ink) }
  .langs button.on{ background:var(--red); color:#fff }

  @media (max-width:700px){ .fs-btn{ top:auto; bottom:14px } header{ padding-top:64px } }
</style>
</head>
<body>

<div class="langs" id="langs"><button data-lang="uk">УКР</button><button data-lang="ru">РУС</button><button data-lang="pl">PL</button></div>
<button class="btn ghost fs-btn" id="fsBtn">⛶ <span data-i18n="fs">На весь екран</span></button>

<header>
  <h1 data-i18n="title">Колесо фортуни</h1>
  <div class="sub" data-i18n="sub">Натисніть «Крутити» або пробіл</div>
</header>

<main>
  <div class="wheel-wrap" id="wrap">
    <svg class="pointer" id="pointer" viewBox="0 0 60 80">
      <defs>
        <linearGradient id="pg" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#fff2d0"/><stop offset="1" stop-color="#c99a45"/>
        </linearGradient>
      </defs>
      <path d="M30 78 L4 22 A26 26 0 1 1 56 22 Z" fill="url(#pg)" stroke="#111" stroke-width="3"/>
      <circle cx="30" cy="24" r="9" fill="#d0021b" stroke="#111" stroke-width="2"/>
    </svg>
    <canvas id="wheel"></canvas>
    <button class="hub" id="spinBtn" data-i18n="spin">Крутити</button>
  </div>

  <aside class="panel">
    <h2 data-i18n="settings">Налаштування</h2>
    <label for="maxN" data-i18n="count">Кількість учасників (номери від 1 до …)</label>
    <div class="row">
      <input type="number" id="maxN" min="2" max="500" value="50">
      <button class="btn" id="applyBtn" data-i18n="apply">Застосувати</button>
    </div>

    <label for="speed" data-i18n="speed">Швидкість обертання</label>
    <select id="speed">
      <option value="9" data-i18n="s1">Повільно (~9 с)</option>
      <option value="13" selected data-i18n="s2">Дуже повільно (~13 с)</option>
      <option value="18" data-i18n="s3">Інтрига (~18 с)</option>
    </select>

    <label class="toggle"><input type="checkbox" id="noRepeat" checked> <span data-i18n="norep">Не повторювати номери, що вже випали</span></label>
    <label class="toggle"><input type="checkbox" id="sound" checked> <span data-i18n="sound">Звук</span></label>

    <div class="stats"><span><span data-i18n="left">Залишилось</span>: <b id="leftCount">50</b></span><span><span data-i18n="drawn">Випало</span>: <b id="drawnCount">0</b></span></div>
    <div class="history" id="history"><span class="empty" data-i18n="empty">Ще нічого не випало</span></div>

    <div class="actions">
      <button class="btn ghost" id="undoBtn">↶ <span data-i18n="undo">Повернути останній</span></button>
      <button class="btn ghost" id="resetBtn" data-i18n="reset">Почати заново</button>
    </div>
    <div class="hint" data-i18n="hint">Якщо людей прийшло більше — просто змініть число й натисніть «Застосувати»: номери, що вже випали, збережуться.</div>
  </aside>
</main>

<div class="reveal" id="reveal">
  <div class="label" data-i18n="win">Виграшний номер</div>
  <div class="card"><div class="card-inner" id="cardInner">
    <div class="face front"><div class="num" id="revealNum">7</div></div>
    <div class="face back"><span>?</span></div>
  </div></div>
  <div class="close" data-i18n="close">Натисніть будь-де, щоб продовжити</div>
</div>
<canvas id="confetti"></canvas>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('wheel'), ctx = canvas.getContext('2d');
  const spinBtn = $('spinBtn'), pointer = $('pointer');
  const TAU = Math.PI * 2;

  // ---------- state ----------
  let maxN = 50, drawn = [], rotation = 0, spinning = false;
  const store = {
    load(){ try{ const s = JSON.parse(localStorage.getItem('koleso-state')||'null'); if(s){ maxN = s.maxN||50; drawn = Array.isArray(s.drawn)?s.drawn:[]; $('noRepeat').checked = s.noRepeat!==false; $('sound').checked = s.sound!==false; if(s.speed) $('speed').value = s.speed; } }catch(e){} },
    save(){ try{ localStorage.setItem('koleso-state', JSON.stringify({maxN, drawn, noRepeat:$('noRepeat').checked, sound:$('sound').checked, speed:$('speed').value})); }catch(e){} }
  };
  store.load();
  $('maxN').value = maxN;

  const noRepeat = () => $('noRepeat').checked;
  function numbers(){
    const all = Array.from({length:maxN}, (_,i)=>i+1);
    return noRepeat() ? all.filter(n => !drawn.includes(n)) : all;
  }
  let slices = numbers();

  // ---------- drawing ----------
  let size = 0;
  function resize(){
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    size = r.width;
    canvas.width = r.width*dpr; canvas.height = r.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  function sliceColor(i, n){
    // red / black alternating; for odd counts the last slice is dark red so no neighbours match
    if (n % 2 === 1 && i === n-1) return '#6e0010';
    return i % 2 === 0 ? '#c8021a' : '#0d0d0d';
  }
  function draw(){
    const n = slices.length, c = size/2, R = c*0.94, seg = TAU/Math.max(n,1);
    ctx.clearRect(0,0,size,size);

    // outer rim
    ctx.beginPath(); ctx.arc(c,c,c*0.995,0,TAU);
    const rim = ctx.createRadialGradient(c,c,R*0.9,c,c,c);
    rim.addColorStop(0,'#2b0006'); rim.addColorStop(.5,'#111'); rim.addColorStop(1,'#000');
    ctx.fillStyle = rim; ctx.fill();

    if (n === 0){
      ctx.beginPath(); ctx.arc(c,c,R,0,TAU); ctx.fillStyle='#111'; ctx.fill();
      ctx.fillStyle='#9a8f8f'; ctx.font=`600 ${size*0.04}px Inter`; ctx.textAlign='center';
      ctx.fillText(t('all'), c, c+size*0.2);
      return;
    }

    for (let i=0;i<n;i++){
      const a0 = rotation + i*seg - Math.PI/2, a1 = a0 + seg;
      ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,R,a0,a1); ctx.closePath();
      ctx.fillStyle = sliceColor(i,n); ctx.fill();
      ctx.strokeStyle = 'rgba(232,194,122,.55)'; ctx.lineWidth = Math.max(1, size*0.0025); ctx.stroke();

      // label
      ctx.save();
      ctx.translate(c,c); ctx.rotate(a0 + seg/2);
      const fs = Math.max(9, Math.min(size*0.055, (TAU*R*0.8/n)*0.8));
      ctx.font = `700 ${fs}px Oswald, sans-serif`;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 4;
      ctx.fillText(String(slices[i]), R*0.92, 0);
      ctx.restore();
    }

    // inner shading
    const shade = ctx.createRadialGradient(c,c,R*0.2,c,c,R);
    shade.addColorStop(0,'rgba(0,0,0,.35)'); shade.addColorStop(.6,'rgba(0,0,0,0)'); shade.addColorStop(1,'rgba(0,0,0,.35)');
    ctx.beginPath(); ctx.arc(c,c,R,0,TAU); ctx.fillStyle = shade; ctx.fill();

    // gold ring + bulbs
    ctx.beginPath(); ctx.arc(c,c,R,0,TAU); ctx.strokeStyle='#e8c27a'; ctx.lineWidth=size*0.008; ctx.stroke();
    const bulbs = 24, br = (R + c*0.995)/2;
    for (let b=0;b<bulbs;b++){
      const a = b*TAU/bulbs + (spinning ? 0 : 0);
      const on = (Math.floor(bulbPhase) + b) % 2 === 0;
      ctx.beginPath(); ctx.arc(c + Math.cos(a)*br, c + Math.sin(a)*br, size*0.009, 0, TAU);
      ctx.fillStyle = on ? '#fff3d6' : '#7a1a22';
      ctx.shadowColor = on ? '#ffcc66' : 'transparent'; ctx.shadowBlur = on ? 10 : 0;
      ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  let bulbPhase = 0;

  // ---------- sound ----------
  let actx = null;
  function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function tickSound(){
    if (!$('sound').checked) return;
    const a = audio(); if(!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type='triangle'; o.frequency.value = 1400 + Math.random()*200;
    g.gain.setValueAtTime(0.12, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+0.05);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+0.06);
  }
  function winSound(){
    if (!$('sound').checked) return;
    const a = audio(); if(!a) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>{
      const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+i*0.12;
      o.type='sawtooth'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.09,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.65);
    });
  }

  // ---------- spin ----------
  function randInt(n){ const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] % n; }
  function randFloat(){ const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0]/4294967296; }

  function spin(){
    if (spinning) return;
    slices = numbers();
    if (slices.length === 0){ draw(); return; }
    audio(); if (actx && actx.state === 'suspended') actx.resume();

    const n = slices.length, seg = TAU/n;
    const idx = randInt(n);
    const jitter = (randFloat()-0.5) * seg * 0.7;
    const target = ((-(idx+0.5)*seg + jitter) % TAU + TAU) % TAU;
    const cur = ((rotation % TAU) + TAU) % TAU;
    let delta = target - cur; if (delta < 0) delta += TAU;
    const duration = parseFloat($('speed').value) * 1000;
    const turns = Math.round(duration/1000 * 0.75) + 3;   // more turns for longer spins
    const start = rotation, total = turns*TAU + delta;
    const t0 = performance.now();
    let lastSlice = Math.floor((start)/seg);

    spinning = true; spinBtn.disabled = true; spinBtn.textContent = '…';
    const ease = t => 1 - Math.pow(1 - t, 4); // easeOutQuart: long, slow, suspenseful finish

    function frame(now){
      const t = Math.min(1, (now - t0)/duration);
      rotation = start + total*ease(t);
      bulbPhase += 0.25;
      const s = Math.floor(rotation/seg);
      if (s !== lastSlice){ lastSlice = s; tickSound(); pointer.classList.remove('tick'); void pointer.offsetWidth; pointer.classList.add('tick'); }
      draw();
      if (t < 1) requestAnimationFrame(frame);
      else {
        rotation = start + total;
        spinning = false;
        setTimeout(() => showWinner(slices[idx]), 450);
      }
    }
    requestAnimationFrame(frame);
  }

  // ---------- reveal ----------
  let lastWinner = null;
  function showWinner(num){
    lastWinner = num;
    drawn.push(num); store.save(); renderHistory();
    $('revealNum').textContent = num;
    const inner = $('cardInner'); inner.style.animation='none'; void inner.offsetWidth; inner.style.animation='';
    $('reveal').classList.add('show');
    setTimeout(() => { winSound(); confetti(); }, 1100);
  }
  function hideReveal(){
    if (!$('reveal').classList.contains('show')) return;
    $('reveal').classList.remove('show');
    stopConfetti();
    slices = numbers(); draw();
    spinBtn.disabled = false; spinBtn.textContent = t('spin');
  }
  $('reveal').addEventListener('click', hideReveal);

  // ---------- confetti ----------
  const cc = $('confetti'), cx = cc.getContext('2d');
  let parts = [], confRaf = null;
  function confetti(){
    cc.width = innerWidth; cc.height = innerHeight;
    const colors = ['#d0021b','#ff3b4f','#ffffff','#e8c27a','#111111'];
    parts = Array.from({length:220}, () => ({
      x: innerWidth/2 + (randFloat()-0.5)*120, y: innerHeight*0.45,
      vx: (randFloat()-0.5)*18, vy: -randFloat()*18 - 6,
      w: 6+randFloat()*8, h: 8+randFloat()*12, r: randFloat()*TAU, vr:(randFloat()-0.5)*0.4,
      c: colors[randInt(colors.length)], life: 0
    }));
    cancelAnimationFrame(confRaf);
    (function loop(){
      cx.clearRect(0,0,cc.width,cc.height);
      parts.forEach(p => { p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life*0.1))); cx.restore(); });
      parts = parts.filter(p => p.y < cc.height + 40);
      if (parts.length) confRaf = requestAnimationFrame(loop);
    })();
  }
  function stopConfetti(){ cancelAnimationFrame(confRaf); parts = []; cx.clearRect(0,0,cc.width,cc.height); }

  // ---------- UI ----------
  function renderHistory(){
    const h = $('history');
    $('drawnCount').textContent = drawn.length;
    $('leftCount').textContent = Math.max(0, maxN - (noRepeat() ? drawn.filter(d=>d<=maxN).length : 0));
    if (!drawn.length){ h.innerHTML = '<span class="empty">' + t('empty') + '</span>'; return; }
    h.innerHTML = drawn.map((d,i) => `<span class="chip${i===drawn.length-1?' last':''}">${d}</span>`).join('');
    h.scrollTop = h.scrollHeight;
  }
  function apply(){
    if (spinning) return;
    const v = Math.max(2, Math.min(500, parseInt($('maxN').value,10) || 2));
    $('maxN').value = v; maxN = v;
    slices = numbers(); store.save(); renderHistory(); draw();
  }
  $('applyBtn').addEventListener('click', apply);
  $('maxN').addEventListener('keydown', e => { if (e.key==='Enter') apply(); });
  $('noRepeat').addEventListener('change', () => { slices = numbers(); store.save(); renderHistory(); draw(); });
  $('sound').addEventListener('change', store.save);
  $('speed').addEventListener('change', store.save);
  $('undoBtn').addEventListener('click', () => { if (spinning || !drawn.length) return; drawn.pop(); store.save(); slices = numbers(); renderHistory(); draw(); });

  // in-page confirm for reset (native confirm is blocked in some viewers)
  let resetArmed = false, resetTimer;
  $('resetBtn').addEventListener('click', () => {
    if (spinning) return;
    if (!resetArmed){ resetArmed = true; $('resetBtn').textContent = t('sure'); resetTimer = setTimeout(()=>{ resetArmed=false; $('resetBtn').textContent=t('reset'); }, 3000); return; }
    clearTimeout(resetTimer); resetArmed = false; $('resetBtn').textContent=t('reset');
    drawn = []; store.save(); slices = numbers(); renderHistory(); draw();
  });

  spinBtn.addEventListener('click', spin);
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space' || e.code === 'Enter'){
      e.preventDefault();
      if ($('reveal').classList.contains('show')) hideReveal(); else spin();
    }
    if (e.key === 'Escape') hideReveal();
  });

  $('fsBtn').addEventListener('click', async () => {
    try{
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch(e){ $('fsBtn').textContent = t('fsNo'); }
  });

  // idle bulb twinkle
  setInterval(() => { if (!spinning){ bulbPhase += 1; draw(); } }, 600);

  window.addEventListener('resize', resize);
  document.fonts && document.fonts.ready.then(draw);

  // ---------- languages ----------
  const I18N = {
    uk:{title:'Колесо фортуни',sub:'Натисніть «Крутити» або пробіл',spin:'Крутити',settings:'Налаштування',
      count:'Кількість учасників (номери від 1 до …)',apply:'Застосувати',speed:'Швидкість обертання',
      s1:'Повільно (~9 с)',s2:'Дуже повільно (~13 с)',s3:'Інтрига (~18 с)',norep:'Не повторювати номери, що вже випали',
      sound:'Звук',left:'Залишилось',drawn:'Випало',empty:'Ще нічого не випало',undo:'Повернути останній',
      reset:'Почати заново',sure:'Точно? Натисніть ще раз',
      hint:'Якщо людей прийшло більше — просто змініть число й натисніть «Застосувати»: номери, що вже випали, збережуться.',
      win:'Виграшний номер',close:'Натисніть будь-де, щоб продовжити',fs:'На весь екран',fsNo:'Повний екран недоступний',all:'Усі номери вже випали'},
    ru:{title:'Колесо фортуны',sub:'Нажмите «Крутить» или пробел',spin:'Крутить',settings:'Настройки',
      count:'Количество участников (номера от 1 до …)',apply:'Применить',speed:'Скорость вращения',
      s1:'Медленно (~9 с)',s2:'Очень медленно (~13 с)',s3:'Интрига (~18 с)',norep:'Не повторять выпавшие номера',
      sound:'Звук',left:'Осталось',drawn:'Выпало',empty:'Пока ничего не выпало',undo:'Вернуть последний',
      reset:'Начать заново',sure:'Точно? Нажмите ещё раз',
      hint:'Если людей пришло больше — просто измените число и нажмите «Применить»: выпавшие номера сохранятся.',
      win:'Выигрышный номер',close:'Нажмите в любом месте, чтобы продолжить',fs:'Во весь экран',fsNo:'Полный экран недоступен',all:'Все номера уже выпали'},
    pl:{title:'Koło fortuny',sub:'Kliknij „Kręć” lub spację',spin:'Kręć',settings:'Ustawienia',
      count:'Liczba uczestników (numery od 1 do …)',apply:'Zastosuj',speed:'Prędkość obrotu',
      s1:'Wolno (~9 s)',s2:'Bardzo wolno (~13 s)',s3:'Napięcie (~18 s)',norep:'Nie powtarzaj wylosowanych numerów',
      sound:'Dźwięk',left:'Pozostało',drawn:'Wylosowano',empty:'Jeszcze nic nie wylosowano',undo:'Cofnij ostatni',
      reset:'Zacznij od nowa',sure:'Na pewno? Kliknij jeszcze raz',
      hint:'Jeśli przyszło więcej osób — zmień liczbę i kliknij „Zastosuj”: wylosowane numery zostaną zachowane.',
      win:'Zwycięski numer',close:'Kliknij gdziekolwiek, aby kontynuować',fs:'Pełny ekran',fsNo:'Pełny ekran niedostępny',all:'Wszystkie numery już wylosowano'}
  };
  let lang = 'uk';
  try{ const l = localStorage.getItem('koleso-lang'); if (I18N[l]) lang = l; }catch(e){}
  const t = k => I18N[lang][k];
  function setLang(l){
    lang = l; try{ localStorage.setItem('koleso-lang', l); }catch(e){}
    document.documentElement.lang = l;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
    if (spinning) spinBtn.textContent = '…';
    renderHistory(); draw();
  }
  document.querySelectorAll('#langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  resize(); setLang(lang);
})();
</script>
</body>
</html>
